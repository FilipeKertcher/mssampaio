    :root{
      --navy: #081f3a; /* azul marinho */
      --gold: #d4af37; /* dourado */
      --muted: #7b8fa6;
      --card-w: 420px;
      --radius: 16px;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#e9f0f7 0%, #ffffff 100%);margin:0;padding:24px}
    .card{width:100%;max-width:var(--card-w);background:var(--navy);color:var(--gold);border-radius:var(--radius);padding:28px;box-shadow:0 10px 30px rgba(2,20,40,0.25);}
    .top{display:flex;gap:18px;align-items:center;justify-content:space-between}
    .meta{flex:1}
    .name{font-size:20px;font-weight:700;letter-spacing:0.2px;margin:0}
    .role{margin-top:6px;margin-bottom:0;color:var(--muted);font-weight:600;font-size:13px}
    .divider{height:1px;background:linear-gradient(90deg, rgba(212,175,55,0.06), rgba(212,175,55,0.02));margin:18px 0;border-radius:2px}
    .contacts{display:flex;flex-direction:column;gap:10px}
    .btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.03);text-decoration:none;color:var(--gold);font-weight:600;border:1px solid rgba(212,175,55,0.06)}
    .btn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
    .iconsvg{width:20px;height:20px;flex:0 0 20px}
    .actions{display:flex;gap:10px;margin-top:12px}
    .chip{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.04);font-weight:600;color:var(--gold);font-size:13px;text-decoration:none}
    .foot{margin-top:16px;color:var(--muted);font-size:12px}
    @media (max-width:480px){.card{padding:20px;border-radius:12px}}
  </style>
